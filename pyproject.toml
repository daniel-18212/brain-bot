[project]
name = "brain-bot"
version = "2.0.0"
description = "Institutional-Grade Multi-Model Telegram AI Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=21.6",
    "openai>=1.52.0",
    "google-generativeai>=0.8.3",
    "groq>=0.11.0",
    "aiosqlite>=0.20.0",
    "pypdf>=5.0.0",
    "duckduckgo-search>=6.3.0",
    "aiohttp>=3.10.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psutil>=6.0.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
